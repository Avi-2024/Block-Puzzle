name: Puzzle Android Recording
on:
  push:
    branches: [codex/fresh-puzzle-prototype]
    paths: ['.github/workflows/puzzle_capture.yml']
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Run containing fresh-puzzle-capture-apk
        default: '37730923374'
        required: true
permissions:
  contents: read
  actions: read
jobs:
  record-android:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: fresh-puzzle-capture-apk
          run-id: ${{ inputs.build_run_id || '37730923374' }}
          github-token: ${{ github.token }}
          path: prototype/build/review/
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Record existing Flutter capture APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_6
          ram-size: 1536M
          cores: 2
          emulator-options: -no-window -gpu swiftshader_indirect -feature -Vulkan -no-snapshot -no-boot-anim -no-audio
          disable-animations: false
          script: bash prototype/tool/capture_preview.sh
      - name: Upload Android animation video and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fresh-puzzle-android-preview
          path: prototype/build/native-preview/
          if-no-files-found: ignore
