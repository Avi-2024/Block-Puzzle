name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        id: analyze
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          flutter analyze 2>&1 | tee analyze.log

      - name: Test
        id: test
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          flutter test 2>&1 | tee test.log

      - name: Upload diagnostics
        if: steps.analyze.outcome == 'failure' || steps.test.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: flutter-diagnostics
          path: |
            analyze.log
            test.log
          retention-days: 7

      - name: Quality gate
        if: steps.analyze.outcome == 'failure' || steps.test.outcome == 'failure'
        run: exit 1
