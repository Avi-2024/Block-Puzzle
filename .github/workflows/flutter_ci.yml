name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        id: analyze
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          flutter analyze 2>&1 | tee analyze.log

      - name: Test
        id: test
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          flutter test 2>&1 | tee test.log

      - name: Generate Android platform scaffold
        id: scaffold
        if: steps.analyze.outcome == 'success' && steps.test.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          flutter create --platforms=android --org com.blockiva --project-name blockiva . 2>&1 | tee scaffold.log

      - name: Apply Android game and test-ad configuration
        id: branding
        if: steps.scaffold.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text()
          text = text.replace('android:label="blockiva"', 'android:label="Blockiva"')

          activity_marker = 'android:name=".MainActivity"'
          if 'android:screenOrientation=' not in text:
              text = text.replace(
                  activity_marker,
                  activity_marker + '\n            android:screenOrientation="portrait"',
                  1,
              )

          if 'android.permission.INTERNET' not in text:
              root_end = text.index('>') + 1
              text = (
                  text[:root_end]
                  + '\n    <uses-permission android:name="android.permission.INTERNET" />'
                  + text[root_end:]
              )

          if 'com.google.android.gms.ads.APPLICATION_ID' not in text:
              application_start = text.index('<application')
              application_open_end = text.index('>', application_start) + 1
              metadata = (
                  '\n        <!-- Google sample App ID: test APKs only. -->\n'
                  '        <meta-data\n'
                  '            android:name="com.google.android.gms.ads.APPLICATION_ID"\n'
                  '            android:value="ca-app-pub-3940256099942544~3347511713" />'
              )
              text = (
                  text[:application_open_end]
                  + metadata
                  + text[application_open_end:]
              )

          manifest.write_text(text)
          PY
          grep -nE 'android:label|screenOrientation|INTERNET|APPLICATION_ID' android/app/src/main/AndroidManifest.xml

      - name: Build debug APK
        id: build
        if: steps.branding.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          flutter build apk --debug 2>&1 | tee build.log

      - name: Upload debug APK
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: blockiva-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7

      - name: Upload diagnostics
        if: steps.analyze.outcome == 'failure' || steps.test.outcome == 'failure' || steps.scaffold.outcome == 'failure' || steps.branding.outcome == 'failure' || steps.build.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: flutter-diagnostics
          path: |
            analyze.log
            test.log
            scaffold.log
            build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Quality gate
        if: steps.analyze.outcome == 'failure' || steps.test.outcome == 'failure' || steps.scaffold.outcome == 'failure' || steps.branding.outcome == 'failure' || steps.build.outcome == 'failure'
        run: exit 1
