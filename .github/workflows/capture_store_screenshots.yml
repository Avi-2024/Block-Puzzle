name: Capture Store Screenshots

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/capture_store_screenshots.yml'
      - 'lib/**'
      - 'tool/capture_android_ui.sh'
      - 'tool/audio_smoke.dart'
      - 'tool/check_android_audio.py'

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Android scaffold
        run: flutter create --platforms=android --org com.blockiva --project-name blockiva .

      - name: Brand native Android splash
        run: python3 tool/configure_android_splash.py

      - name: Configure screenshot build
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text()
          text = text.replace('android:label="blockiva"', 'android:label="Blockiva"')
          activity_marker = 'android:name=".MainActivity"'
          if 'android:screenOrientation=' not in text:
              text = text.replace(
                  activity_marker,
                  activity_marker + '\n            android:screenOrientation="portrait"',
                  1,
              )
          if 'android.permission.INTERNET' not in text:
              root_end = text.index('>') + 1
              text = text[:root_end] + '\n    <uses-permission android:name="android.permission.INTERNET" />' + text[root_end:]
          if 'com.google.android.gms.ads.APPLICATION_ID' not in text:
              application_start = text.index('<application')
              application_open_end = text.index('>', application_start) + 1
              metadata = (
                  '\n        <meta-data\n'
                  '            android:name="com.google.android.gms.ads.APPLICATION_ID"\n'
                  '            android:value="ca-app-pub-3940256099942544~3347511713" />'
              )
              text = text[:application_open_end] + metadata + text[application_open_end:]
          manifest.write_text(text)
          PY

      - name: Build gameplay, clear review, and audio verification APKs
        run: |
          mkdir -p build/qa
          flutter build apk --debug
          cp build/app/outputs/flutter-apk/app-debug.apk build/qa/gameplay.apk
          flutter build apk --debug -t tool/audio_smoke.dart
          cp build/app/outputs/flutter-apk/app-debug.apk build/qa/audio-smoke.apk
          flutter build apk --debug -t tool/clear_capture.dart
          cp build/app/outputs/flutter-apk/app-debug.apk build/qa/clear-review.apk

      - name: Set up host audio capture
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pulseaudio ffmpeg
          # Emulator and recorder run as the same user. A private PulseAudio
          # runtime keeps their monitor capture isolated from other jobs.
          mkdir -p "$RUNNER_TEMP/blockiva-pulse"
          chmod 700 "$RUNNER_TEMP/blockiva-pulse"
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/blockiva-pulse"
          echo "XDG_RUNTIME_DIR=$XDG_RUNTIME_DIR" >> "$GITHUB_ENV"
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=blockiva
          pactl set-default-sink blockiva
          # Android Emulator's QEMU process failed to connect to the runner-
          # temp PA socket. Publish a local-only socket
          # in /tmp, the location used by Google's emulator container setup.
          pactl load-module module-native-protocol-unix socket=/tmp/blockiva-pulse.sock auth-anonymous=1
          pactl -s unix:/tmp/blockiva-pulse.sock info
          echo 'PULSE_SERVER=unix:/tmp/blockiva-pulse.sock' >> "$GITHUB_ENV"
          echo 'QEMU_PA_SERVER=unix:/tmp/blockiva-pulse.sock' >> "$GITHUB_ENV"
          echo 'QEMU_AUDIO_DRV=pa' >> "$GITHUB_ENV"
          echo 'PULSE_SINK=blockiva' >> "$GITHUB_ENV"
          echo 'QEMU_PA_SINK=blockiva' >> "$GITHUB_ENV"

      - name: Release build daemon memory before emulator
        run: ./android/gradlew -p android --stop

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Capture screenshots on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          ram-size: 2048M
          cores: 2
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim
          disable-animations: true
          script: bash tool/capture_android_ui.sh

      - name: Verify captured Android audio
        run: python3 tool/check_android_audio.py store/indus/screenshots

      - name: Verify screenshot dimensions
        shell: bash
        run: |
          python3 - <<'PY'
          import struct
          from pathlib import Path
          paths = sorted(Path('store/indus/screenshots').glob('*.png'))
          expected = {
              '01-gameplay.png': (1080, 1920),
              '02-mid-game.png': (1080, 1920),
              '03-small-screen.png': (720, 1280),
          }
          review = {f'review-{i:02}.png': (540, 960) for i in range(1, 11)}
          expected.update(review)
          expected.update({
              'clear-seeded.png': (1080, 1920),
              'clear-after.png': (1080, 1920),
          })
          expected.update({f'clear-review-{i:02}.png': (540, 960) for i in range(1, 7)})
          if {path.name for path in paths} != set(expected):
              raise SystemExit('Expected gameplay and seeded line-clear captures')
          for path in paths:
              with path.open('rb') as f:
                  f.read(16)
                  width, height = struct.unpack('>II', f.read(8))
              print(path, width, height)
              if (width, height) != expected[path.name]:
                  raise SystemExit(f'Unexpected screenshot size: {path} {width}x{height}')
          PY

      - name: Upload screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blockiva-android-visual-qa
          path: store/indus/screenshots/
          if-no-files-found: warn
          retention-days: 30
