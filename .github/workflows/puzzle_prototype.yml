name: Fresh Puzzle Prototype
on:
  push:
    branches: [codex/fresh-puzzle-prototype]
    paths: ['prototype/**', '.github/workflows/puzzle_prototype.yml']
  workflow_dispatch:
    inputs:
      legacy_build_run_id:
        description: Optional v0.2 build run for reproducing the old missing-runtime defect
        required: false
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: puzzle-prototype-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: prototype
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install dependencies
        run: flutter pub get
      - name: Format original Dart sources
        run: |
          dart format lib test tool
          dart fix --apply --code=curly_braces_in_flow_control_structures
          dart format lib test tool
      - name: Retain formatted sources and resolved dependencies
        uses: actions/upload-artifact@v4
        with:
          name: fresh-puzzle-formatted-source
          path: |
            prototype/lib/
            prototype/test/
            prototype/tool/*.dart
            prototype/pubspec.lock
      - name: Analyze
        run: flutter analyze
      - name: Test rules, touch input and responsive screens
        run: PUZZLE_CAPTURE_UI=1 flutter test
      - name: Upload actual Flutter review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fresh-puzzle-screenshots
          path: prototype/build/prototype-review/
          if-no-files-found: ignore
      - name: Generate isolated Android preview app
        run: |
          flutter create --platforms=android --org com.blockiva --project-name puzzle_prototype .
          python3 tool/brand_android.py
      - name: Build playable APK
        run: |
          flutter build apk --release --target-platform android-arm,android-arm64,android-x64
          mkdir -p build/review
          cp build/app/outputs/flutter-apk/app-release.apk build/review/block-puzzle-prototype.apk
          python3 tool/check_apk_abis.py build/review/block-puzzle-prototype.apk
      - name: Upload playable APK and dependency lock
        uses: actions/upload-artifact@v4
        with:
          name: fresh-puzzle-playable-apk
          path: |
            prototype/build/review/block-puzzle-prototype.apk
            prototype/pubspec.lock
      - name: Build animation capture APK
        run: |
          flutter build apk --release --target-platform android-x64 -t tool/preview_main.dart
          cp build/app/outputs/flutter-apk/app-release.apk build/review/animation-preview.apk
      - name: Transfer capture APK to a clean runner
        uses: actions/upload-artifact@v4
        with:
          name: fresh-puzzle-capture-apk
          path: prototype/build/review/animation-preview.apk
          retention-days: 7
  record-android:
    needs: quality-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: fresh-puzzle-capture-apk
          path: prototype/build/review/
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Record the Flutter APK on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_6
          ram-size: 1536M
          cores: 2
          emulator-options: -no-window -gpu swiftshader_indirect -feature -Vulkan -no-snapshot -no-boot-anim -no-audio
          disable-animations: false
          script: bash prototype/tool/capture_preview.sh
      - name: Upload Android animation video and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fresh-puzzle-android-preview
          path: prototype/build/native-preview/
          if-no-files-found: ignore
  verify-playable-startup:
    needs: quality-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        api: [29, 35]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: fresh-puzzle-playable-apk
          path: prototype/build/playable/
      - name: Download previously delivered APK for regression reproduction
        if: matrix.api == 29 && github.event_name == 'workflow_dispatch' && inputs.legacy_build_run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: fresh-puzzle-playable-apk
          run-id: ${{ inputs.legacy_build_run_id }}
          github-token: ${{ github.token }}
          path: prototype/build/prior/
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify exact downloadable APK without launch overrides
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          profile: pixel_6
          ram-size: 2048M
          cores: 2
          emulator-options: -no-window -gpu swiftshader_indirect -feature -Vulkan -no-snapshot -no-boot-anim -no-audio
          disable-animations: false
          script: cd prototype && python3 tool/verify_release.py
      - name: Retain startup screenshots and crash logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tilora-startup-api-${{ matrix.api }}
          path: prototype/build/startup-review/
          if-no-files-found: ignore
