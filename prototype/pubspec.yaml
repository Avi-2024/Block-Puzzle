name: puzzle_prototype
description: Original block puzzle prototype based on the approved October design.
publish_to: 'none'
version: 0.2.9+11
environment:
  sdk: '>=3.10.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.5
  # 2.5.0's JNI getAll bridge fails in the tested Android release APK.
  shared_preferences_android: 2.4.28
  share_plus: ^13.3.1
  audioplayers: ^6.8.1
  audio_session: ^0.2.4
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/audio/effects/
    - assets/audio/voice/bright/

